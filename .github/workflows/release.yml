# Builds and publishes a release when a version tag is pushed (v2.1.0, or v2.1.0-beta.1 for a
# pre-release). See RELEASING.md. The version comes from the tag; the .csproj's <Version> isn't used.
#
# Each architecture is its own Velopack channel (win-x64, win-arm64). An installed copy keeps the
# channel it was installed from, and finds its updates in this repo's GitHub releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161   # keep in step with the Velopack package in AgentDock.csproj
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  # Native AOT compiles on each architecture's own runner, so ARM64 doesn't need to cross-compile.
  publish:
    strategy:
      fail-fast: false   # one architecture failing shouldn't hide whether the other works
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json   # the SDK the repo pins

      - name: Publish (Native AOT)
        shell: pwsh
        run: |
          # The AOT linker looks for vswhere.exe on PATH.
          $env:PATH += ";${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/AgentDock/AgentDock.csproj -c Release -r ${{ matrix.rid }} -o publish `
            -p:Version=$version -nologo

      - uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.rid }}
          path: publish

  # Packing and signing both run on x64. vpk's signing tools (signtool and the Artifact Signing
  # plug-in) are x64 only, and on the windows-11-arm runner signtool exited with 3 and no output
  # (v1.1.1-beta.4). vpk packs any architecture from any machine, and signing doesn't care which
  # CPU a binary is for.
  pack:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    runs-on: windows-latest
    # Signing. The `release` environment only runs from v* tags, and Azure trusts only this repo's
    # `release` environment, so nothing but a release tag can sign. Its variables are the signing
    # identity's ids (not secrets). See RELEASING.md, "Code signing".
    environment: release
    permissions:
      contents: read
      id-token: write   # GitHub's sign-in token for Azure; no password is stored anywhere
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json   # the SDK the repo pins

      - uses: actions/download-artifact@v8
        with:
          name: publish-${{ matrix.rid }}
          path: publish

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          "pre=$($version.Contains('-'))".ToLower() >> $env:GITHUB_OUTPUT

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # The previous release's full package, so vpk can build a delta from it. None the first time.
      - name: Download the previous release
        shell: pwsh
        run: |
          $pre = if ('${{ steps.version.outputs.pre }}' -eq 'true') { '--pre' } else { $null }
          vpk download github --repoUrl $env:REPO_URL --token ${{ secrets.GITHUB_TOKEN }} `
            --channel ${{ matrix.rid }} -o releases $pre
          # Without it the release just has no delta; everyone downloads the full package.
          if ($LASTEXITCODE) { Write-Warning "No previous release to build a delta from."; exit 0 }

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Signs our binaries and Setup.exe with Azure Artifact Signing (tools\signing.json), leaving
      # files that are already signed (the Windows App SDK's) alone; see tools\Sign-File.ps1.
      - name: Package and sign
        shell: pwsh
        run: |
          $sign = "pwsh -NoProfile -ExecutionPolicy Bypass -File ${{ github.workspace }}\tools\Sign-File.ps1 {{file}}"
          vpk pack --packId KiwiGeek.AgentDock --packVersion ${{ steps.version.outputs.version }} `
            --packTitle "Agent Dock" --packAuthors KiwiGeek --packDir publish --mainExe AgentDock.exe `
            --icon src\AgentDock\Assets\AgentDock.ico --runtime ${{ matrix.rid }} --channel ${{ matrix.rid }} `
            --shortcuts StartMenuRoot --signTemplate $sign -o releases
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # A release must never go out half signed.
      - name: Check signatures
        shell: pwsh
        run: |
          # What ships: Setup.exe, and every binary in the full package (vpk signs copies, not publish\).
          $setup = Get-ChildItem releases\*-Setup.exe
          $app = Join-Path $env:RUNNER_TEMP pkg
          # This version's package by name: releases\ also holds the previous release's (for the delta).
          $full = "releases\KiwiGeek.AgentDock-${{ steps.version.outputs.version }}-${{ matrix.rid }}-full.nupkg"
          Expand-Archive $full -DestinationPath $app
          $unsigned = @($setup) + @(Get-ChildItem $app -Recurse -Include *.exe, *.dll) |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($unsigned) { $unsigned.FullName | ForEach-Object { "::error::Not signed: $_" }; exit 1 }
          "Signed as: " + (Get-AuthenticodeSignature $setup.FullName).SignerCertificate.Subject

      - uses: actions/upload-artifact@v7
        with:
          name: releases-${{ matrix.rid }}
          path: releases

  release:
    needs: pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json   # the SDK the repo pins

      - uses: actions/download-artifact@v8
        with:
          pattern: releases-*

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # One release holding both channels: the first upload creates it, the second adds to it. Each
      # channel has its own feed file, so x64 copies can update before the ARM64 files are in.
      - name: Upload to the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $pre = if ($tag.Contains('-')) { '--pre' } else { $null }
          foreach ($rid in 'win-x64', 'win-arm64') {
            vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --channel $rid `
              -o "releases-$rid" --tag $tag --releaseName "Agent Dock $tag" --publish --merge $pre
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          # GitHub's own notes: the commits and pull requests since the previous tag.
          # Through a file: PowerShell would join the note's lines with spaces if passed as an argument.
          gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name=$tag --jq .body > notes.md
          gh release edit $tag --notes-file notes.md
